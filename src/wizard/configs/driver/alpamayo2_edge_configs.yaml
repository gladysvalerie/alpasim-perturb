# @package _global_
#
# Runtime side of the Alpamayo 2 Edge driver: the public six-camera rig profile
# [0, 1, 2, 3, 5, 6] (no rear tele) at 10 Hz, same camera settings as
# exp/presets/alpamayo2_comparison_6cam.yaml, and a 2.3 s ground-truth warm-up
# so the driver holds 2.1 s of frames before its first plan (the Alpamayo 1.x /
# 2 Super default is 1.7 s).
#
# The Edge driver runs outside the containers (own Python env), so use it with
# driver_source=external_static. The runtime finds it at the address below;
# start the driver with the same port (port=7090). The command-line override
# wizard.external_services.driver=[...] only works because this sets the key.

defaults:
  - _self_

wizard:
  external_services:
    driver:
      - "localhost:7090"

runtime:
  simulation_config:
    skip_driver_during_force_gt: true
    force_gt_duration_us: 2_300_000

    cameras:
      - logical_id: camera_cross_left_120fov
        height: 1080
        width: 1900
        frame_interval_us: 100_000
        shutter_duration_us: 30_000
      - logical_id: camera_front_wide_120fov
        height: 1080
        width: 1900
        frame_interval_us: 100_000
        shutter_duration_us: 30_000
      - logical_id: camera_cross_right_120fov
        height: 1080
        width: 1900
        frame_interval_us: 100_000
        shutter_duration_us: 30_000
      - logical_id: camera_rear_left_70fov
        height: 1080
        width: 1900
        frame_interval_us: 100_000
        shutter_duration_us: 30_000
      - logical_id: camera_rear_right_70fov
        height: 1080
        width: 1900
        frame_interval_us: 100_000
        shutter_duration_us: 30_000
      - logical_id: camera_front_tele_30fov
        height: 1080
        width: 1900
        frame_interval_us: 100_000
        shutter_duration_us: 30_000
